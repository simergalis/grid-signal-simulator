<text x="272.0" y="836" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#7D8B9C" text-anchor="start" font-weight="400" letter-spacing="0">Stopping every agent produces a bit-identical dispatch trace. That is not a claim, it is</text>
