name: GridSignal Simulator CI

# ---------------------------------------------------------------------------
# Eight CI gates (Design Spec §12 / Step 17 acceptance matrix)
#
#   Gate 1  — pytest unit suite (all TCs, < 30 s wall time)
#   Gate 2  — plane separation (api/ → core/ import wall, always green)
#   Gate 3  — TC-29 no-PII wire guarantee (deidentify strips site_id/job_id/SKU)
#   Gate 4  — TC-68 egress boundary (zero protection commands)
#   Gate 5  — verdict acceptance (demo-20mw PASS, demo-alert FAIL on no_alert)
#   Gate 6  — load / NFR gate (5+ concurrent runs, tick latency < 1 s, 4 h < 30 s)
#             runs only on changes touching core/, runtime/, or advisory/
#   Gate 7  — determinism gate (each seeded scenario × 2 concurrent, hash matches)
#   Gate 8  — shipped-scenario smoke (all 5 seeded scenarios run to completion)
# ---------------------------------------------------------------------------

on:
  push:
    branches: ["main", "develop", "feature/**"]
  pull_request:
    branches: ["main", "develop"]

defaults:
  run:
    working-directory: gridsignal_sim

env:
  PYTHONPATH: .
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Gate 1–5: full pytest suite (covers gates 1–5 in one run)
  # ──────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: "Gate 1-5 — pytest unit suite"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install \
            fastapi uvicorn httpx pytest pytest-asyncio anyio \
            pydantic anthropic mistralai 2>/dev/null || true

      - name: "Gate 1 — full pytest suite"
        run: |
          pytest tests/ -q --tb=short --timeout=120
          echo "Gate 1 PASS: unit suite"

      - name: "Gate 2 — plane separation (static)"
        run: |
          pytest tests/test_plane_separation.py -q --tb=short
          echo "Gate 2 PASS: plane separation"

      - name: "Gate 3 — TC-29 no-PII wire guarantee"
        run: |
          pytest tests/test_step12_advisory.py::TestTC29NoPII -q --tb=short
          echo "Gate 3 PASS: no-PII wire"

      - name: "Gate 4 — TC-68 egress boundary"
        run: |
          pytest tests/test_step11_scada.py::TestTC68NoProtectionCommands -q --tb=short
          echo "Gate 4 PASS: TC-68 egress"

      - name: "Gate 5 — verdict acceptance"
        run: |
          pytest tests/test_verdicts.py -q --tb=short
          echo "Gate 5 PASS: verdict acceptance"

  # ──────────────────────────────────────────────────────────────────────────
  # Gate 6: Load / NFR gate — only on changes to core/, runtime/, advisory/
  # ──────────────────────────────────────────────────────────────────────────
  load-test:
    name: "Gate 6 — load / NFR gate"
    runs-on: ubuntu-latest
    needs: unit-tests

    # Run the load test only when code that affects the run-management path
    # is touched.  The concurrency and tick-latency NFRs are only meaningful
    # for those layers; running it on every CSS or doc change is wasteful.
    if: >
      github.event_name == 'push' &&
      (
        contains(github.event.head_commit.modified, 'core/') ||
        contains(github.event.head_commit.modified, 'runtime/') ||
        contains(github.event.head_commit.modified, 'advisory/')
      )

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install \
            fastapi uvicorn httpx pytest pytest-asyncio anyio \
            pydantic anthropic mistralai 2>/dev/null || true

      - name: "Gate 6 — load test (5 concurrent, 4 h scenario, < 30 s wall)"
        run: |
          PYTEST_CURRENT_TEST=load_gate/synthetic \
          python scripts/load_test.py \
            --runs 5 \
            --duration-hours 4.0 \
            --speed 0 \
            --report-json /tmp/load_report.json
          echo "Gate 6 PASS: NFR gate"

      - name: Upload load test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-report
          path: /tmp/load_report.json

  # ──────────────────────────────────────────────────────────────────────────
  # Gate 7: Determinism gate — always runs
  # ──────────────────────────────────────────────────────────────────────────
  determinism-gate:
    name: "Gate 7 — dispatch trace determinism"
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install \
            fastapi uvicorn httpx pytest pytest-asyncio anyio \
            pydantic anthropic mistralai 2>/dev/null || true

      - name: "Gate 7 — determinism gate (all 5 seeded scenarios × 2 concurrent)"
        run: |
          python scripts/determinism_gate.py \
            --verbose \
            --report-json /tmp/determinism_report.json
          echo "Gate 7 PASS: dispatch hash matches"

      - name: Upload determinism report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: determinism-report
          path: /tmp/determinism_report.json

  # ──────────────────────────────────────────────────────────────────────────
  # Gate 8: Shipped-scenario smoke — run all seeded scenarios end-to-end
  # ──────────────────────────────────────────────────────────────────────────
  scenario-smoke:
    name: "Gate 8 — shipped-scenario matrix smoke"
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install \
            fastapi uvicorn httpx pytest pytest-asyncio anyio \
            pydantic anthropic mistralai 2>/dev/null || true

      - name: "Gate 8 — column-3 shipped-scenario tests"
        run: |
          pytest \
            tests/test_step16_wiring.py::test_demo_prestage_column3_tc55_tc56 \
            tests/test_step16_wiring.py::test_demo_pms_column3_tc64_to_tc68 \
            tests/test_step16_wiring.py::test_energy_summary_includes_cost_breakdown \
            tests/test_f2_bridging_basis.py \
            -v --tb=short
          echo "Gate 8 PASS: shipped-scenario smoke"
