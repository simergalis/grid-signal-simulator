<line x1="272.0" y1="786" x2="1328.0" y2="786" stroke="#1E2A36"/>
<text x="272.0" y="812" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#4B5764" text-anchor="start" font-weight="700" letter-spacing="1.6">WHY THIS MATTERS</text>
<text x="272.0" y="836" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#7D8B9C" text-anchor="start" font-weight="400" letter-spacing="0">A compute step and its cooling response are two separate events roughly 90 seconds apart.</text>
<text x="272.0" y="854" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#7D8B9C" text-anchor="start" font-weight="400" letter-spacing="0">A reactive controller meets each one after it arrives, and meets the second having already</text>
<text x="272.0" y="872" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#7D8B9C" text-anchor="start" font-weight="400" letter-spacing="0">spent its ramp on the first. The lag is why one threshold cannot work.</text>
