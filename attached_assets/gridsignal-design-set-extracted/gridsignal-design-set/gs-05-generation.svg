<text x="272.0" y="854" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#7D8B9C" text-anchor="start" font-weight="400" letter-spacing="0">At 0.2 MW/s this unit delivers 9.0 MW in the 45 s of warning the scheduler gives —</text>
