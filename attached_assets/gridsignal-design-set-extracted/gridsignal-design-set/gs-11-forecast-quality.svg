<text x="952.0" y="686" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#7D8B9C" text-anchor="start" font-weight="400" letter-spacing="0">Autonomous curtailment</text><text x="1328.0" y="688" font-family="'SF Mono','Roboto Mono',Menlo,Consolas,monospace" font-size="15" fill="#D9534F" text-anchor="end" font-weight="500" letter-spacing="0">blocked</text><text x="952.0" y="702" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#4B5764" text-anchor="start" font-weight="400" letter-spacing="0">degraded segments never curtail · TC-43</text>
<line x1="272.0" y1="786" x2="1328.0" y2="786" stroke="#1E2A36"/>
<text x="272.0" y="812" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#4B5764" text-anchor="start" font-weight="700" letter-spacing="1.6">WHY THIS MATTERS</text>
<text x="272.0" y="836" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#7D8B9C" text-anchor="start" font-weight="400" letter-spacing="0">A forecast that cannot say how much to trust it is worse than one that admits doubt.</text>
<text x="272.0" y="854" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#7D8B9C" text-anchor="start" font-weight="400" letter-spacing="0">Tags compose additively and each widens the band; dispatch sizes off the LOWER bound,</text>
<text x="272.0" y="872" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#7D8B9C" text-anchor="start" font-weight="400" letter-spacing="0">so a wider band produces more conservative staging, never a silent guess.</text>
