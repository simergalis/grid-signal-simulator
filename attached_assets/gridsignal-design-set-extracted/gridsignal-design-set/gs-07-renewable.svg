<text x="952.0" y="582" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#7D8B9C" text-anchor="start" font-weight="400" letter-spacing="0">Lead time on loss</text><text x="1328.0" y="584" font-family="'SF Mono','Roboto Mono',Menlo,Consolas,monospace" font-size="15" fill="#D9534F" text-anchor="end" font-weight="500" letter-spacing="0">0 s</text><text x="952.0" y="598" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#4B5764" text-anchor="start" font-weight="400" letter-spacing="0">no advance signal exists</text>
<text x="952.0" y="634" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#7D8B9C" text-anchor="start" font-weight="400" letter-spacing="0">Forecast treatment</text><text x="1328.0" y="636" font-family="'SF Mono','Roboto Mono',Menlo,Consolas,monospace" font-size="15" fill="#E6ECF2" text-anchor="end" font-weight="500" letter-spacing="0">subtracted</text><text x="952.0" y="650" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#4B5764" text-anchor="start" font-weight="400" letter-spacing="0">reduces demand, never closes a gap</text>
<text x="952.0" y="686" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#7D8B9C" text-anchor="start" font-weight="400" letter-spacing="0">Agent authority</text><text x="1328.0" y="688" font-family="'SF Mono','Roboto Mono',Menlo,Consolas,monospace" font-size="15" fill="#7D8B9C" text-anchor="end" font-weight="500" letter-spacing="0">advisory only</text><text x="952.0" y="702" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#4B5764" text-anchor="start" font-weight="400" letter-spacing="0">by construction — no dispatch path</text>
<line x1="272.0" y1="786" x2="1328.0" y2="786" stroke="#1E2A36"/>
<text x="272.0" y="812" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#4B5764" text-anchor="start" font-weight="700" letter-spacing="1.6">WHY THIS MATTERS</text>
<text x="272.0" y="836" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#7D8B9C" text-anchor="start" font-weight="400" letter-spacing="0">Renewable output is subtracted from the load the fleet must serve. It is never added to</text>
<text x="272.0" y="854" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#7D8B9C" text-anchor="start" font-weight="400" letter-spacing="0">ramp capability, because it cannot be commanded and carries no lead time on loss.</text>
<text x="272.0" y="872" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#7D8B9C" text-anchor="start" font-weight="400" letter-spacing="0">A 6 MW solar collapse and a 6 MW compute spike are the same event to the arbitrator.</text>
