kind = "api"
# Step 16 / §10.2: In production, this artifact deploys the GridSignal Simulator v2
# (Python FastAPI + pre-built React frontend served as static files, single port).
# The dev run command remains the Node.js API stub used by monorepo workspace tooling.
# NOTE: path changed from "/api" to "/api-server" — "/api" was intercepting all
# auth/admin/runs requests before they could reach the Python backend on port 22126.
# The gridsignal artifact at "/" owns all /api/* traffic in both dev and production.
previewPath = "/api-server"
title = "GridSignal Simulator"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "GridSignal Simulator"
paths = ["/api-server"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
# Installs npm deps and compiles the React dashboard to frontend/dist/.
# No external database or cloud service is referenced — §22.7 / v2.5 §0.1.
args = ["bash", "attached_assets/gridsignal_sim_v2_build_package/gridsignal_sim_v2/gridsignal_sim/scripts/build_prod.sh"]

[services.production.run]
# §10.2 single-process, single-port: uvicorn serves FastAPI (REST/WS) +
# the pre-built React frontend as static files.
# LP-1: both MISTRAL_API_KEY and ANTHROPIC_API_KEY absent → heuristic fallback,
# no crash.  The sim is fully functional without any LLM keys.
args = ["bash", "attached_assets/gridsignal_sim_v2_build_package/gridsignal_sim_v2/gridsignal_sim/scripts/start_prod.sh"]

[services.production.health.startup]
path = "/healthz"
